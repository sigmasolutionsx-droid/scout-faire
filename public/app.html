<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scout-Faire - Niche Analysis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c1810 0%, #1a0f0a 100%);
            color: #f5f5f5;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: rgba(0, 0, 0, 0.6);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid rgba(200, 16, 46, 0.3);
            backdrop-filter: blur(10px);
        }

        .logo h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #c8102e 0%, #003f87 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
        }

        .logo p {
            color: #d4a574;
            font-size: 0.8rem;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .user-info {
            text-align: right;
        }

        .user-email {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .tier-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .tier-free {
            background: rgba(102, 102, 102, 0.3);
            border: 2px solid #666;
            color: #999;
        }

        .tier-elite {
            background: rgba(200, 16, 46, 0.3);
            border: 2px solid #c8102e;
            color: #ff6b6b;
        }

        .tier-oracle {
            background: rgba(0, 63, 135, 0.3);
            border: 2px solid #003f87;
            color: #5b9cff;
        }

        .search-counter {
            margin-top: 8px;
            font-size: 0.85rem;
            color: #d4a574;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Analysis Form */
        .analysis-section {
            background: rgba(30, 20, 15, 0.8);
            border: 3px solid #666;
            border-radius: 12px;
            padding: 40px;
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 2rem;
            color: #d4a574;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .section-subtitle {
            color: #aaa;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #d4a574;
            font-weight: 500;
            letter-spacing: 1px;
        }

        input[type="text"] {
            width: 100%;
            padding: 18px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #666;
            border-radius: 8px;
            color: #f5f5f5;
            font-size: 1.1rem;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #c8102e;
        }

        input[type="text"]::placeholder {
            color: #888;
        }

        .analyze-btn {
            width: 100%;
            padding: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: linear-gradient(135deg, #c8102e 0%, #8b0a1f 100%);
            color: white;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .analyze-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #d11635 0%, #9c0b23 100%);
            transform: scale(1.02);
            box-shadow: 0 6px 25px rgba(200, 16, 46, 0.5);
        }

        .analyze-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Results Section */
        .results-section {
            background: rgba(30, 20, 15, 0.8);
            border: 3px solid #666;
            border-radius: 12px;
            padding: 40px;
            display: none;
        }

        .results-section.show {
            display: block;
        }

        .niche-title {
            font-size: 1.8rem;
            color: #d4a574;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .scores-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .score-card {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #666;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .score-label {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #d4a574;
        }

        .analysis-content {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid #555;
            border-radius: 8px;
            padding: 30px;
            line-height: 1.8;
        }

        /* Analysis Formatting Styles */
        .analysis-content .analysis-header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #666;
        }

        .analysis-content .niche-name {
            font-size: 2rem;
            color: #d4a574;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .analysis-content .tier-indicator {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .analysis-content .tier-free {
            background: rgba(102, 102, 102, 0.3);
            border: 2px solid #666;
            color: #999;
        }

        .analysis-content .tier-elite {
            background: rgba(200, 16, 46, 0.3);
            border: 2px solid #c8102e;
            color: #ff6b6b;
        }

        .analysis-content .tier-oracle {
            background: rgba(0, 63, 135, 0.3);
            border: 2px solid #003f87;
            color: #5b9cff;
        }

        .analysis-content .section {
            margin-bottom: 40px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 25px;
        }

        .analysis-content .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #666;
        }

        .analysis-content .section-header h3 {
            font-size: 1.5rem;
            color: #d4a574;
            margin: 0;
        }

        .analysis-content .score-badge {
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1.1rem;
            border: 2px solid;
        }

        .analysis-content .elite-badge,
        .analysis-content .oracle-badge {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .analysis-content .elite-badge {
            background: rgba(200, 16, 46, 0.2);
            border: 1px solid #c8102e;
            color: #ff6b6b;
        }

        .analysis-content .oracle-badge {
            background: rgba(0, 63, 135, 0.2);
            border: 1px solid #003f87;
            color: #5b9cff;
        }

        /* Gap Cards */
        .analysis-content .gap-card {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid #555;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .analysis-content .gap-card:hover {
            border-color: #c8102e;
            transform: translateX(5px);
        }

        .analysis-content .gap-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .analysis-content .gap-number {
            background: #d4a574;
            color: #1a0f0a;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .analysis-content .gap-header h4 {
            flex: 1;
            margin: 0;
            color: #d4a574;
            font-size: 1.2rem;
        }

        .analysis-content .difficulty-badge {
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            border: 1px solid;
        }

        .analysis-content .gap-details {
            padding-left: 50px;
        }

        .analysis-content .gap-item {
            margin-bottom: 10px;
            color: #ccc;
        }

        .analysis-content .gap-item strong {
            color: #d4a574;
        }

        /* Monetization Blueprint Cards */
        .analysis-content .blueprint-card {
            background: linear-gradient(135deg, rgba(0, 63, 135, 0.1) 0%, rgba(0, 0, 0, 0.3) 100%);
            border: 2px solid #003f87;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .analysis-content .blueprint-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #003f87;
        }

        .analysis-content .blueprint-header h4 {
            margin: 0;
            color: #5b9cff;
            font-size: 1.3rem;
        }

        .analysis-content .blueprint-content {
            color: #ccc;
        }

        /* Tables */
        .analysis-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            background: rgba(0, 0, 0, 0.2);
        }

        .analysis-content table th {
            background: rgba(212, 165, 116, 0.2);
            color: #d4a574;
            padding: 12px;
            text-align: left;
            border: 1px solid #666;
            font-weight: bold;
        }

        .analysis-content table td {
            padding: 12px;
            border: 1px solid #555;
            color: #ccc;
        }

        .analysis-content table tr:hover {
            background: rgba(212, 165, 116, 0.1);
        }

        /* Typography */
        .analysis-content p {
            margin-bottom: 15px;
            color: #ccc;
        }

        .analysis-content strong {
            color: #d4a574;
        }

        .analysis-content em {
            color: #aaa;
        }

        .analysis-content ul {
            margin: 10px 0;
            padding-left: 20px;
        }

        .analysis-content li {
            margin-bottom: 8px;
            color: #ccc;
        }

        /* Upgrade Prompt */
        .upgrade-prompt {
            background: linear-gradient(135deg, rgba(200, 16, 46, 0.2) 0%, rgba(0, 63, 135, 0.2) 100%);
            border: 2px solid #c8102e;
            border-radius: 12px;
            padding: 30px;
            margin-top: 30px;
            text-align: center;
        }

        .upgrade-prompt h3 {
            font-size: 1.5rem;
            color: #d4a574;
            margin-bottom: 15px;
        }

        .upgrade-prompt p {
            color: #ccc;
            margin-bottom: 20px;
            font-size: 1.05rem;
        }

        .upgrade-btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #003f87 0%, #002855 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .upgrade-btn:hover {
            background: linear-gradient(135deg, #004a9f 0%, #003366 100%);
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(0, 63, 135, 0.5);
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 40px;
            color: #d4a574;
        }

        .spinner {
            border: 4px solid rgba(212, 165, 116, 0.2);
            border-top: 4px solid #d4a574;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Error Message */
        .error-message {
            background: rgba(200, 16, 46, 0.2);
            border: 2px solid #c8102e;
            color: #ff6b6b;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* Logout Button */
        .logout-btn {
            background: none;
            border: 1px solid #666;
            color: #aaa;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            border-color: #c8102e;
            color: #c8102e;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }

            .user-info {
                text-align: center;
            }

            .analysis-section, .results-section {
                padding: 25px;
            }

            .section-title {
                font-size: 1.5rem;
            }
        }

        @media print {
            @page { margin: 1.5cm; size: A4; }

            .no-print, .header, .analysis-section, button, .btn { display: none !important; }

            body { background: white !important; margin: 0 !important; padding: 0 !important; color: #1e293b !important; }

            .results-section { padding: 0 !important; background: white !important; }

            .result-card, .blueprint-card {
                box-shadow: none !important;
                border: 1px solid #d1d5db !important;
                break-inside: avoid;
                page-break-inside: avoid;
                margin-bottom: 1rem !important;
                background: white !important;
            }

            .blueprint-header {
                background: #f1f5f9 !important;
                color: #1e293b !important;
            }
            .blueprint-header * { color: #1e293b !important; }

            .results-section > * + * { margin-top: 0.75rem !important; }

            [style*="gradient"] { background: white !important; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="logo">
            <h1>SCOUT-FAIRE</h1>
            <p>ANALYTICS INTELLIGENT</p>
        </div>
        <div class="user-info">
            <div class="user-email" id="user-email">Loading...</div>
            <div>
                <span class="tier-badge" id="tier-badge">FREE</span>
            </div>
            <div class="search-counter" id="search-counter">5 searches remaining</div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Analysis Form -->
        <div class="analysis-section">
            <h2 class="section-title">Analyze Your Niche</h2>
            <p class="section-subtitle">Enter a niche market to get instant competitive intelligence</p>

            <div id="error-message" class="error-message"></div>

            <form id="analysis-form">
                <div class="input-group">
                    <label for="niche-input">Niche Keyword or Market</label>
                    <input 
                        type="text" 
                        id="niche-input" 
                        name="niche" 
                        placeholder="e.g., organic dog food, eco-friendly yoga mats, vintage watches"
                        required
                    >
                </div>
                <button type="submit" class="analyze-btn" id="analyze-btn">
                    Analyze Niche
                </button>
            </form>
        </div>

        <!-- Results Section -->
        <div class="results-section" id="results-section">
            <h3 class="niche-title" id="results-niche"></h3>
            
            <div class="scores-grid" id="scores-grid"></div>
            
            <div class="analysis-content" id="analysis-content"></div>
            
            <div class="upgrade-prompt" id="upgrade-prompt" style="display: none;">
                <h3>Want More Insights?</h3>
                <p id="upgrade-message"></p>
                <a href="pricing.html" class="upgrade-btn">View Upgrade Options</a>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let userData = null;

        // Check auth on page load (session-cookie based)
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/api/auth/user', {
                    credentials: 'same-origin'
                });

                if (!response.ok) {
                    window.location.href = 'login.html';
                    return;
                }

                const data = await response.json();
                userData = data;
                updateUserDisplay();
            } catch (error) {
                console.error('Auth check failed:', error);
                window.location.href = 'login.html';
            }
        });

        function updateUserDisplay() {
            document.getElementById('user-email').textContent = userData.email;
            
            const tierBadge = document.getElementById('tier-badge');
            tierBadge.textContent = userData.tier.toUpperCase();
            tierBadge.className = `tier-badge tier-${userData.tier}`;
            
            const counter = document.getElementById('search-counter');
            if (userData.tier === 'free') {
                counter.textContent = `${userData.searches_remaining} of 5 searches remaining`;
            } else {
                counter.textContent = `Unlimited searches (${userData.tier.toUpperCase()} tier)`;
            }
        }

        // Handle analysis form submission
        document.getElementById('analysis-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const niche = document.getElementById('niche-input').value.trim();
            const errorMessage = document.getElementById('error-message');
            const analyzeBtn = document.getElementById('analyze-btn');
            const resultsSection = document.getElementById('results-section');

            // Clear previous errors
            errorMessage.classList.remove('show');
            errorMessage.textContent = '';

            // Hide previous results
            resultsSection.classList.remove('show');

            // Show loading state
            analyzeBtn.disabled = true;
            analyzeBtn.textContent = 'Analyzing...';

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({
                        niche: niche,
                        userId: userData.id
                    })
                });

                const data = await response.json();

                if (!data.success) {
                    if (data.error === 'limit_reached') {
                        showUpgradePrompt();
                        throw new Error(data.message || 'Monthly search limit reached');
                    }
                    throw new Error(data.error || 'Analysis failed');
                }

                // Update search counter
                userData.searches_remaining = data.usage.searches_remaining;
                updateUserDisplay();

                // Show results
                displayResults(niche, data);

            } catch (error) {
                errorMessage.textContent = error.message;
                errorMessage.classList.add('show');
            } finally {
                analyzeBtn.disabled = false;
                analyzeBtn.textContent = 'Analyze Niche';
            }
        });

        function displayResults(niche, data) {
            const resultsSection = document.getElementById('results-section');
            const resultsNiche = document.getElementById('results-niche');
            const scoresGrid = document.getElementById('scores-grid');
            const analysisContent = document.getElementById('analysis-content');

            // Set niche title
            resultsNiche.textContent = niche.toUpperCase();

            // Display scores
            scoresGrid.innerHTML = '';
            const scores = data.scores || {};
            
            if (scores.market !== null) {
                scoresGrid.innerHTML += createScoreCard('Market Demand', scores.market);
            }
            if (scores.competition !== null) {
                scoresGrid.innerHTML += createScoreCard('Competition', scores.competition);
            }
            if (scores.profitability !== null) {
                scoresGrid.innerHTML += createScoreCard('Profitability', scores.profitability);
            }
            if (scores.overall !== null) {
                scoresGrid.innerHTML += createScoreCard('Overall Opportunity', scores.overall);
            }

            // Display analysis (now as HTML)
            analysisContent.innerHTML = data.analysis;

            // Show upgrade prompt if free tier
            if (userData.tier === 'free') {
                showTierUpgradeMessage('free');
            } else if (userData.tier === 'elite') {
                showTierUpgradeMessage('elite');
            }

            // Show results
            resultsSection.classList.add('show');
            resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function createScoreCard(label, value) {
            return `
                <div class="score-card">
                    <div class="score-label">${label}</div>
                    <div class="score-value">${value}/10</div>
                </div>
            `;
        }

        function showTierUpgradeMessage(tier) {
            const upgradePrompt = document.getElementById('upgrade-prompt');
            const upgradeMessage = document.getElementById('upgrade-message');

            if (tier === 'free') {
                upgradeMessage.textContent = 'Upgrade to ELITE to see competitor gaps and opportunities, or ORACLE for full monetization blueprints.';
                upgradePrompt.style.display = 'block';
            } else if (tier === 'elite') {
                upgradeMessage.textContent = 'Upgrade to ORACLE to get detailed monetization blueprints showing exactly how to profit from each gap.';
                upgradePrompt.style.display = 'block';
            }
        }

        function showUpgradePrompt() {
            const upgradePrompt = document.getElementById('upgrade-prompt');
            const upgradeMessage = document.getElementById('upgrade-message');
            upgradeMessage.textContent = "You've used all 5 free searches this month. Upgrade for unlimited analyses!";
            upgradePrompt.style.display = 'block';
        }

        function logout() {
            window.location.href = '/api/logout';
        }
    </script>
</body>
</html>
