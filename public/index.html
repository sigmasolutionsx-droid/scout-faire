<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude API Analyzer</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
    textarea { width: 100%; height: 150px; margin: 10px 0; }
    button { padding: 10px 20px; cursor: pointer; }
    #result { margin-top: 20px; padding: 15px; background: #f5f5f5; border-radius: 5px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Claude API Analyzer</h1>
  <textarea id="text" placeholder="Enter text to analyze..."></textarea>
  <button onclick="analyze()">Analyze</button>
  <div id="result"></div>
  <script>
    async function analyze() {
      const text = document.getElementById('text').value;
      const resultDiv = document.getElementById('result');
      resultDiv.textContent = 'Analyzing...';
      try {
        const response = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        const data = await response.json();
        resultDiv.textContent = data.result || data.error;
      } catch (error) {
        resultDiv.textContent = 'Error: ' + error.message;
      }
    }
  </script>
</body>
</html>
