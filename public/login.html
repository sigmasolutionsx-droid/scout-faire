<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Scout-Faire</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c1810 0%, #1a0f0a 100%);
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            max-width: 500px;
            width: 100%;
            background: rgba(30, 20, 15, 0.8);
            border: 3px solid #666;
            border-radius: 12px;
            padding: 50px 40px;
            backdrop-filter: blur(10px);
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #c8102e 0%, #003f87 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .logo p {
            color: #d4a574;
            font-size: 0.9rem;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #d4a574;
            font-weight: 500;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #666;
            border-radius: 8px;
            color: #f5f5f5;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #c8102e;
        }

        input::placeholder {
            color: #888;
        }

        .btn {
            width: 100%;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: linear-gradient(135deg, #c8102e 0%, #8b0a1f 100%);
            color: white;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #d11635 0%, #9c0b23 100%);
            transform: scale(1.02);
            box-shadow: 0 6px 25px rgba(200, 16, 46, 0.5);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            background: rgba(200, 16, 46, 0.2);
            border: 1px solid #c8102e;
            color: #ff6b6b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: rgba(74, 222, 128, 0.2);
            border: 1px solid #4ade80;
            color: #4ade80;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .signup-link {
            text-align: center;
            margin-top: 25px;
            color: #aaa;
        }

        .signup-link a {
            color: #c8102e;
            text-decoration: none;
            font-weight: bold;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .divider {
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, #666 50%, transparent 100%);
            margin: 30px 0;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }

            .logo h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>SCOUT-FAIRE</h1>
            <p>ANALYTICS INTELLIGENT</p>
        </div>

        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="your@email.com" 
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter your password" 
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="btn" id="login-btn">
                Log In
            </button>
        </form>

        <div class="divider"></div>

        <div class="signup-link">
            Don't have an account? <a href="signup.html">Sign Up Free</a>
        </div>
    </div>

    <script>
        const API_BASE = 'https://amatuedda-backend-production.up.railway.app';
        const form = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');
        const successMessage = document.getElementById('success-message');
        const submitBtn = document.getElementById('login-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Clear previous messages
            errorMessage.classList.remove('show');
            errorMessage.textContent = '';
            successMessage.classList.remove('show');
            successMessage.textContent = '';

            // Disable button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging In...';

            try {
                console.log('Sending login request...');
                
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);

                if (data.success && data.token) {
                    // CRITICAL: Save token FIRST, then show success, then redirect
                    console.log('Saving token:', data.token.substring(0, 20) + '...');
                    localStorage.setItem('auth_token', data.token);
                    
                    // Verify token was saved
                    const savedToken = localStorage.getItem('auth_token');
                    console.log('Token saved successfully:', savedToken ? 'YES' : 'NO');
                    
                    // Show success message
                    successMessage.textContent = 'Login successful! Redirecting...';
                    successMessage.classList.add('show');
                    
                    // Wait a moment to ensure storage is complete, then redirect
                    setTimeout(() => {
                        console.log('Redirecting to app.html...');
                        window.location.href = 'app.html';
                    }, 500);
                    
                } else {
                    throw new Error(data.error || 'Login failed - no token received');
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = error.message || 'An error occurred. Please try again.';
                errorMessage.classList.add('show');
                
                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.textContent = 'Log In';
            }
        });

        // Debug: Check if we came from a redirect with an error
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');
            if (error) {
                errorMessage.textContent = 'Session expired or invalid. Please log in again.';
                errorMessage.classList.add('show');
            }
        });
    </script>
</body>
</html>
